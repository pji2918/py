# This is a (maybe) educational dbms server

networks:
  dbnet:
services:
  dbms:
    image: mariadb:12-ubi10
    ports:
      - 3306:3306
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=1
    volumes:
      - ~/development/mariadb:/var/lib/mysql
    networks:
      dbnet:
        ipv4_address: 10.89.0.5
    container_name: mariadb
  phpmyadmin:
    image: phpmyadmin
    ports:
      - 8080:80
    environment:
      - PMA_HOST=10.89.0.5:3306
    networks:
      dbnet:
    container_name: phpmyadmin
