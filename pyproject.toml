[project]
name = "py"
version = "0.1.0"
description = "this is my python file collection."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.2",
    "pyclip>=0.7.0",
    "requests>=2.32.5",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "wikipedia>=1.4.0",
    "wordcloud>=1.9.6",
]
classifiers = [
    "Private :: Do Not Upload",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "notebook>=7.5.5",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
