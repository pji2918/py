[project]
name = "py"
version = "0.1.0"
description = "this is my python file collection."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "konlpy>=0.6.0",
    "matplotlib>=3.10.3",
    "nltk>=3.9.2",
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.2",
    "pycryptodome>=3.23.0",
    "pymysql[ed25519]>=1.1.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.44",
    "textblob>=0.19.0",
    "wikipedia>=1.4.0",
    "wordcloud>=1.9.4",
]
classifiers = [
    "Private :: Do Not Upload",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
