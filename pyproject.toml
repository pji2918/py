[project]
name = "py"
version = "0.1.0"
description = "this is my python file collection."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pyclip>=0.7.0",
    "requests>=2.32.5",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
]
classifiers = [
    "Private :: Do Not Upload",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "notebook>=7.5.5",
]
